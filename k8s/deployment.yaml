apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-test
  template:
    metadata:
      labels:
        app: devops-test
    spec:
      containers:
        - name: devops-test
          image: sheviv/devops-test:1.0
